<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>Better YT UI 設定</title>
    <style>
        html,
        body {
            margin: 0;
            background: #fff;
        }

        body {
            display: flex;
            justify-content: center;
            color: #0f0f0f;
            color-scheme: light;
            font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            box-sizing: border-box;
            width: 260px;
            padding: 16px;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 15px;
            font-weight: 600;
        }

        label {
            display: block;
            margin-bottom: 2px;
            font-weight: 500;
        }

        #hint {
            margin: 0 0 10px;
            color: #606060;
            font-size: 12px;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        select,
        button {
            height: 32px;
            border-radius: 8px;
            font: inherit;
        }

        select {
            flex: 1;
            min-width: 0;
            padding: 0 8px;
            border: 1px solid #ccc;
            background: #fff;
        }

        button {
            padding: 0 14px;
            border: 0;
            background: #0f0f0f;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover {
            background: #272727;
        }

        button:active {
            background: #000;
        }

        select:focus-visible,
        button:focus-visible {
            outline: 2px solid #0f0f0f;
            outline-offset: 2px;
        }

        #status {
            min-height: 1.2em;
            margin: 10px 0 0;
            color: #107c41;
            font-size: 12px;
        }

        #status.is-error {
            color: #c00;
        }
    </style>
</head>
<body>
    <main>
        <h1>Better YT UI</h1>
        <label for="items-per-row">每列影片數</label>
        <p id="hint">預設 5。</p>
        <div class="row">
            <select id="items-per-row"></select>
            <button id="save" type="button">儲存</button>
        </div>
        <p id="status" role="status"></p>
    </main>
    <script src="shared.js"></script>
    <script src="options.js"></script>
</body>
</html>
